<h2>Installed</h2>
<p>Open <b>MacROOT</b> from Applications. Some actions (mounting an EFI partition, writing to it) ask for your administrator password.</p>
<p>MacROOT always backs up your EFI to <i>~/Documents/MacROOT Backups</i> before changing it — but keep your own backup too.</p>
</body></html>
