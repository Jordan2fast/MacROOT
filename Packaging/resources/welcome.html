<h2>MacROOT</h2>
<p>A toolbox for Hackintosh (x86_64) systems: EFI mounter, OpenCore &amp; kext updater, config.plist checker, SMBIOS generator, USB mapper and kext builder.</p>
<p>This installer puts <b>MacROOT.app</b> in your Applications folder. Requires macOS 13 or newer on an Intel/x86_64 Mac.</p>
